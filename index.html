<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteroids Arcade</title>
    <link rel="stylesheet" href="asteroids-arcade.css" />
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="800" height="600" aria-label="Asteroids Arcade game canvas"></canvas>
      <div id="hud" aria-live="polite">
        <span id="score">Score: 0</span>
        <span id="lives">Lives: 3</span>
        <span id="help">←/→ Rotate · ↑ Thrust · Space Shoot · R Restart</span>
      </div>
      <div id="gameOver" hidden>GAME OVER — Press R to Restart</div>
    </div>

    <script src="asteroids-arcade.js"></script>
  </body>
</html>
